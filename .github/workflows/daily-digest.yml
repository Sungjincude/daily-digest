name: Daily Digest
on:
  schedule:
    - cron: "0 6 * * *"  # 6 AM UTC = 9 AM Greece (EEST, summer)
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save seen articles back to repo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add seen_articles.json
          git diff --cached --quiet || git commit -m "update: seen articles $(date -u +%F)"
          git push

      - name: Upload digest log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest-log
          path: "*.log"
          retention-days: 1
