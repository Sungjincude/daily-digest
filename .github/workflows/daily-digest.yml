name: Daily Digest
on:
  schedule:
    - cron: "0 5 * * *"  # Winter: 5 UTC = 8 AM Greece (EET)
    - cron: "0 6 * * *"  # Summer: 6 UTC = 8 AM Greece (EEST)
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py

      - name: Upload digest log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest-log
          path: "*.log"
          retention-days: 1
